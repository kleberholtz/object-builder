name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | awk 'NR == 1')

          if [ -n "$existing" ]; then
            id=${existing%% *}
            draft=${existing##* }
            if [ "$draft" = "false" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "id=" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already published, skipping."
              exit 0
            fi
            echo "::notice::Reusing the existing draft for $TAG."
          else
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Object Builder $VERSION" \
              -f body="Stable release $VERSION, built from $GITHUB_SHA." \
              -F draft=true \
              --jq .id)
          fi

          if [ -z "$id" ]; then
            echo "::error::Could not resolve a release id for $TAG."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: success() && needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - id: npm
        name: Fingerprint the npm dependency set
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          escaped=${VERSION//./\\.}
          sed "s/\"version\": \"$escaped\"/\"version\": \"0.0.0\"/g" \
            package-lock.json > .npm-lock-fingerprint
          echo "dir=$(npm config get cache | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('.npm-lock-fingerprint') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}-${{ matrix.platform }}
          cache-on-failure: true

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - if: always() && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.npm.outputs.dir }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  publish:
    needs: [prepare, build]
    if: success() && needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::prepare produced no release id; nothing to publish."
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true
