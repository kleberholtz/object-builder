name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The four build jobs share one release, so it is created here instead of by
  # each of them: four jobs racing to find-or-create the same tag is how you end
  # up with duplicate releases holding one asset each.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Every commit bumps the version, but a re-run or a push that changes
      # nothing else must not republish a version that already shipped.
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | awk 'NR == 1')

          if [ -n "$existing" ]; then
            id=${existing%% *}
            draft=${existing##* }
            if [ "$draft" = "false" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "id=" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already published, skipping."
              exit 0
            fi
            # A draft left behind by a run that failed midway: reuse it, so the
            # platforms that did upload keep their assets.
            echo "::notice::Reusing the existing draft for $TAG."
          else
            # The id comes out of the creation response, not out of a second
            # listing: re-reading the list right after the write can come back
            # without the release that was just made, and the empty id that
            # leaves behind is what turns the publish step into a PATCH on
            # `repos/<repo>/releases/` — a 404.
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Object Builder $VERSION" \
              -f body="Stable release $VERSION, built from $GITHUB_SHA." \
              -F draft=true \
              --jq .id)
          fi

          # Fail here rather than three jobs later: a build that uploads to no
          # release at all is the same wasted half hour, minus the reason.
          if [ -z "$id" ]; then
            echo "::error::Could not resolve a release id for $TAG."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: success() && needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 num container, e não a imagem de um runner hospedado: o
          # que o binário de Linux exige do sistema (glibc, webkit2gtk) passa a
          # ser uma linha versionada aqui, em vez de mudar no dia em que a
          # GitHub troca o Ubuntu por baixo do runner.
          - platform: ubuntu-latest
            container: debian:13
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    steps:
      # A imagem base não traz nada do que uma imagem de runner traz pronto, e
      # isso inclui o que as próprias actions usam: git para o checkout, tar e
      # zstd para os caches, curl e certificados para os downloads do toolchain.
      # Roda antes do checkout porque é o checkout o primeiro a precisar.
      - name: Install Debian dependencies
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            tar \
            xz-utils \
            zstd \
            build-essential \
            pkg-config \
            file \
            patchelf \
            desktop-file-utils \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libayatana-appindicator3-dev
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # `cache: npm` do setup-node usa o hash do package-lock.json e **não** tem
      # chave de fallback. Como todo commit sobe a versão, e a versão está
      # escrita dentro do lock, a chave mudava em todo push: a árvore inteira de
      # dependências era rebaixada de novo a cada release. Neutralizar a versão
      # deixa o que sobra ser o que o cache de fato depende — as dependências —,
      # e o restore-keys cobre a mudança que for real, aproveitando a árvore
      # anterior em vez de partir do zero.
      #
      # O Cargo não precisa do mesmo tratamento: o rust-cache já reescreve a
      # versão do pacote para 0.0.0 e descarta as crates do workspace antes de
      # hashear o Cargo.lock.
      - id: npm
        name: Fingerprint the npm dependency set
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          escaped=${VERSION//./\\.}
          sed "s/\"version\": \"$escaped\"/\"version\": \"0.0.0\"/g" \
            package-lock.json > .npm-lock-fingerprint
          echo "dir=$(npm config get cache | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('.npm-lock-fingerprint') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A imagem base faz parte do que os artefatos foram compilados contra,
          # então entra na chave: um target/ produzido no runner Ubuntu não deve
          # ser entregue ao container Debian.
          key: ${{ matrix.target }}-${{ matrix.container && 'debian13' || 'hosted' }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Não há FUSE dentro do container, e o linuxdeploy é ele próprio um
          # AppImage: sem isto ele não consegue nem se montar para rodar.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # The release stays a draft until every platform has uploaded, so nobody
  # downloads a version that is missing three of its four builds.
  publish:
    needs: [prepare, build]
    if: success() && needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::prepare produced no release id; nothing to publish."
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true
